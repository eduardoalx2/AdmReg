<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Região 655</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.300.0"></script>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-pattern relative">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative z-10 border border-slate-700">
        <div class="bg-slate-900 p-8 text-center border-b-4 border-blue-500">
            <picture>
                <source srcset="logo.webp" type="image/webp">
                <img src="logo.png" alt="Logo Região 655" class="h-16 mx-auto mb-4 object-contain" width="80" height="79" onerror="this.style.display='none'">
            </picture>
            <h1 class="text-2xl font-bold text-white uppercase tracking-wider">Painel Admin</h1>
            <p class="text-slate-400 text-sm mt-1">Região 655 • Londrina/PR</p>
        </div>

        <div id="avisos-login-container" class="hidden px-8 pt-6 space-y-3"></div>

        <!-- CARD EM DESTAQUE: VATHOS 2027 (INSCRIÇÃO E ACESSO POR CPF) -->
        <div class="px-8 pt-6">
            <a href="vathos2027.html" class="block group relative overflow-hidden rounded-xl bg-gradient-to-br from-indigo-950 via-slate-900 to-violet-950 p-4 border border-indigo-500/40 shadow-lg hover:shadow-indigo-500/20 hover:border-indigo-400 transition-all">
                <div class="flex items-start justify-between gap-3">
                    <div class="space-y-1">
                        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-[10px] font-extrabold text-indigo-300 uppercase tracking-wider">
                            <span>🔥 Retiro Regional 2027</span>
                        </div>
                        <h2 class="text-base font-extrabold text-white tracking-tight leading-snug group-hover:text-indigo-200 transition-colors">
                            VATHOS 2027 — “Por inteiro”
                        </h2>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            Faça sua <strong>inscrição / pré-reserva</strong> ou acesse sua <strong>Área do Participante</strong> utilizando seu <strong>CPF</strong>.
                        </p>
                    </div>
                    <div class="w-9 h-9 rounded-lg bg-indigo-600 group-hover:bg-indigo-500 text-white flex items-center justify-center shrink-0 shadow-md transition-colors mt-1">
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </div>
                </div>
                <div class="mt-3 pt-2.5 border-t border-white/10 flex items-center justify-between text-[10px] text-indigo-300 font-semibold uppercase tracking-wider">
                    <span>📅 26 a 28 Mar 2027</span>
                    <span class="flex items-center gap-1 text-emerald-300"><i data-lucide="user-check" class="w-3 h-3"></i> Acesso por CPF</span>
                </div>
            </a>
        </div>

        <form id="login-form" class="p-8 space-y-6 pt-5">
            <div id="error-msg" role="alert" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-[13px] font-semibold border border-red-200 text-center leading-tight"></div>

            <div>
                <label for="email" class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail de Acesso</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" aria-hidden="true"></i>
                    <input type="email" id="email" required aria-required="true" autocomplete="email" class="w-full pl-10 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-semibold text-slate-800" placeholder="seu@email.com">
                </div>
            </div>

            <div>
                <label for="senha" class="block text-xs font-bold text-slate-500 uppercase mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" aria-hidden="true"></i>
                    <input type="password" id="senha" required aria-required="true" autocomplete="current-password" class="w-full pl-10 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-semibold text-slate-800" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg uppercase tracking-wider transition-colors shadow-lg flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5"></i> Entrar no Sistema
            </button>

            <div id="links-login-container" class="border-t border-slate-100 pt-4 flex flex-col gap-2">
                <a href="agendaregiao655.html" class="flex items-center justify-center gap-2 py-2.5 rounded-lg border border-slate-200 text-slate-400 hover:text-slate-700 hover:border-slate-300 transition-colors text-[11px] font-semibold uppercase tracking-wider">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Agenda
                </a>
                <a href="presencareg655.html" class="flex items-center justify-center gap-2 py-2.5 rounded-lg border border-slate-200 text-slate-400 hover:text-slate-700 hover:border-slate-300 transition-colors text-[11px] font-semibold uppercase tracking-wider">
                    <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Registrar Presença
                </a>
            </div>
        </form>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { toastError, setupGlobalErrorHandling } from './js/toast.js';

        setupGlobalErrorHandling();

        lucide.createIcons();

        // Carregar configurações dinâmicas da tela de login
        async function loadLoginLayout() {
            try {
                const snap = await getDoc(doc(db, 'configuracoes', 'layout_login'));
                if (snap.exists()) {
                    const dados = snap.data();
                    
                    // Renderizar Avisos
                    if (dados.avisos && dados.avisos.length > 0) {
                        const avisosAtivos = dados.avisos.filter(a => a.ativo);
                        if (avisosAtivos.length > 0) {
                            const cont = document.getElementById('avisos-login-container');
                            cont.classList.remove('hidden');
                            cont.innerHTML = '';
                            
                            avisosAtivos.forEach(aviso => {
                                let colors = 'bg-blue-50 text-blue-700 border-blue-200';
                                let icon = 'info';
                                if (aviso.tipo === 'alerta') { colors = 'bg-amber-50 text-amber-700 border-amber-200'; icon = 'alert-triangle'; }
                                if (aviso.tipo === 'urgente') { colors = 'bg-red-50 text-red-700 border-red-200'; icon = 'alert-octagon'; }
                                
                                cont.innerHTML += `
                                    <div class="p-3 rounded-lg border ${colors} flex items-start gap-3">
                                        <i data-lucide="${icon}" class="w-5 h-5 shrink-0 mt-0.5"></i>
                                        <p class="text-xs font-semibold leading-relaxed">${aviso.texto}</p>
                                    </div>
                                `;
                            });
                        }
                    }

                    // Renderizar Links
                    if (dados.links && dados.links.length > 0) {
                        const linksAtivos = dados.links.filter(l => l.ativo);
                        if (linksAtivos.length > 0) {
                            const contLinks = document.getElementById('links-login-container');
                            contLinks.innerHTML = '';
                            linksAtivos.forEach(link => {
                                contLinks.innerHTML += `
                                    <a href="${link.url}" class="flex items-center justify-center gap-2 py-2.5 rounded-lg border border-slate-200 text-slate-500 hover:text-slate-800 hover:border-slate-300 transition-colors text-[11px] font-semibold uppercase tracking-wider">
                                        <i data-lucide="${link.icone || 'link'}" class="w-3.5 h-3.5"></i> ${link.titulo}
                                    </a>
                                `;
                            });
                        }
                    }
                    
                    lucide.createIcons();
                }
            } catch (e) {
                console.error("Erro ao carregar layout", e);
                toastError('Erro ao carregar configurações da tela de login.');
            }
        }
        
        loadLoginLayout();

        const form = document.getElementById('login-form');
        const btn = document.getElementById('btn-login');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            btn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div> Autenticando...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, senha);
                
                // Buscar dados do usuário no Firestore (fonte autoritativa)
                const q = query(collection(db, "usuarios"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                let userData;
                const gestoresAutorizados = ['eduardoalx@gmail.com', 'marconithatiane@icloud.com', 'audreydbsilva@gmail.com'];
                if (querySnapshot.empty) {
                    if (gestoresAutorizados.includes(email)) {
                        userData = {
                            nome: email === 'marconithatiane@icloud.com' ? 'Thatiane Marconi' : (email === 'audreydbsilva@gmail.com' ? 'Audrey Danielle' : 'Eduardo Silva'),
                            email: email,
                            permissoes: ['admin', 'vathos_admin'],
                            status: 'Ativo'
                        };
                    } else {
                        await signOut(auth);
                        throw new Error("Seu e-mail está autenticado, mas você não tem permissão na tabela de usuários. Fale com o Gestor.");
                    }
                } else {
                    userData = querySnapshot.docs[0].data();
                    if (userData.status !== 'Ativo') {
                        await signOut(auth);
                        throw new Error("Sua conta está inativa. Fale com o Gestor Master.");
                    }
                }

                // Salvar no localStorage e sessionStorage para compatibilidade total
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', userData.nome || '');
                
                const perms = userData.permissoes || [];
                localStorage.setItem('userPerms', JSON.stringify(perms));
                localStorage.setItem('userIgreja', userData.igrejaNome || '');

                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userName', userData.nome || '');
                sessionStorage.setItem('userRole', perms.includes('admin') ? 'admin' : (perms[0] || 'membro'));
                sessionStorage.setItem('userPermissions', JSON.stringify(perms));
                sessionStorage.setItem('userIgreja', userData.igrejaNome || '');
                
                const params = new URLSearchParams(window.location.search);
                const redirectTarget = params.get('redirect');
                if (redirectTarget && !redirectTarget.startsWith('http') && !redirectTarget.startsWith('//')) {
                    window.location.href = redirectTarget;
                } else {
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error(error);
                let msg = "Erro ao fazer login.";
                if (error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
                else if (error.code === 'auth/too-many-requests') msg = "Muitas tentativas falhas. Tente novamente mais tarde.";
                else msg = error.message;

                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
                toastError(msg);
                btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Entrar no Sistema';
                btn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
